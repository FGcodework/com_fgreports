COM_FGREPORTS_FIELD_TITLE_LABEL="Title"
COM_FGREPORTS_FIELD_ALIAS_LABEL="Alias"
COM_FGREPORTS_FIELD_ALIAS_DESC="Used in the front-end URL. Leave empty to auto-generate from the title."
COM_FGREPORTS_FIELD_ALIAS_HINT="auto-generated"
COM_FGREPORTS_FIELD_DESCRIPTION_LABEL="Description"
COM_FGREPORTS_FIELD_SQL_LABEL="SQL Script"
COM_FGREPORTS_FIELD_SQL_DESC="One SELECT script = one report. Use a read-only MS SQL login for the connection configured in Options - this field has no built-in permission model of its own."
COM_FGREPORTS_FIELD_CACHE_TTL_LABEL="Cache (minutes)"
COM_FGREPORTS_FIELD_CACHE_TTL_DESC="0 = run the query on every page view. Any other value caches the result for that many minutes. Note: while cached, the report's result is stored as a second physical copy in Joomla's own cache (file/database/Redis, depending on your Joomla cache configuration) - not just fetched fresh from MS SQL each time. Leave at 0 for reports with sensitive data you don't want duplicated outside the source database."
COM_FGREPORTS_FIELD_PAGE_LIMIT_LABEL="Rows Per Page"
COM_FGREPORTS_FIELD_PAGE_LIMIT_DESC="0 = use the default from Options. Any other value overrides it just for this report."
COM_FGREPORTS_FIELD_STACK_MOBILE_LABEL="Stack On Mobile"
COM_FGREPORTS_FIELD_STACK_MOBILE_DESC="Adds the \"responsiv\" CSS class to this report's table so plg_system_fgresponsivetables (if installed and published) stacks it into cards on narrow screens. Has no effect without that plugin."
COM_FGREPORTS_FIELD_TABLE_CSS_CLASS_LABEL="Extra CSS Class(es)"
COM_FGREPORTS_FIELD_TABLE_CSS_CLASS_DESC="Optional, space-separated CSS class(es) added to this report's table element - e.g. rwd-sticky-col for plg_system_fgresponsivetables' sticky first column. Only letters, numbers, hyphens and underscores are kept."

COM_FGREPORTS_FIELD_SELECT_REPORT_LABEL="Select Report"
COM_FGREPORTS_FIELD_SELECT_REPORT_DESC="Choose which report this menu item should display."
COM_FGREPORTS_VIEW_REPORTS_TITLE="List of Reports"
COM_FGREPORTS_VIEW_REPORTS_DESC="Displays a list of all published SQL reports the logged-in user has permission to see. Each report in the list links to its detail page."
COM_FGREPORTS_VIEW_REPORT_TITLE="Single Report"
COM_FGREPORTS_VIEW_REPORT_DESC="Displays one specific SQL report, chosen below."

COM_FGREPORTS_BUTTON_PREVIEW="Run Preview"
COM_FGREPORTS_PREVIEW_RUNNING="Running..."
COM_FGREPORTS_PREVIEW_NO_ROWS="The query returned no rows."
COM_FGREPORTS_PREVIEW_ROW_COUNT="row(s)"
COM_FGREPORTS_PREVIEW_TRUNCATED="capped - there are more rows than shown"

COM_FGREPORTS_CONFIG_FIELDSET_CONNECTION="MS SQL Server Connection"
COM_FGREPORTS_CONFIG_FIELDSET_EXECUTION="Execution"
COM_FGREPORTS_CONFIG_DBHOST_LABEL="Server / Host"
COM_FGREPORTS_CONFIG_DBHOST_DESC="Hostname or IP address of the MS SQL Server on the local network."
COM_FGREPORTS_CONFIG_DBPORT_LABEL="Port"
COM_FGREPORTS_CONFIG_DBPORT_DESC="Default MS SQL Server port is 1433."
COM_FGREPORTS_CONFIG_DBNAME_LABEL="Database"
COM_FGREPORTS_CONFIG_DBNAME_DESC="Name of the database to query."
COM_FGREPORTS_CONFIG_DBUSER_LABEL="Username"
COM_FGREPORTS_CONFIG_DBUSER_DESC="Use a login that only has SELECT permission - this is the actual security boundary for report scripts."
COM_FGREPORTS_CONFIG_DBPASS_LABEL="Password"
COM_FGREPORTS_CONFIG_DBPASS_DESC="Leave empty to keep the currently saved password."
COM_FGREPORTS_CONFIG_DBENCRYPT_LABEL="Encrypt Connection"
COM_FGREPORTS_CONFIG_DBENCRYPT_DESC="Recommended. Requires a valid certificate on the SQL Server unless you also trust the server certificate below."
COM_FGREPORTS_CONFIG_DBTRUSTCERT_LABEL="Trust Server Certificate"
COM_FGREPORTS_CONFIG_DBTRUSTCERT_DESC="Only enable this on a trusted local network with a self-signed certificate on the SQL Server."
COM_FGREPORTS_CONFIG_DBTIMEOUT_LABEL="Connection Timeout (seconds)"
COM_FGREPORTS_CONFIG_DBTIMEOUT_DESC="How long to wait when opening the connection."
COM_FGREPORTS_CONFIG_DBQUERYTIMEOUT_LABEL="Query Timeout (seconds)"
COM_FGREPORTS_CONFIG_DBQUERYTIMEOUT_DESC="Separate from the connection timeout above - how long a report's SQL script is allowed to run once connected, before it's aborted. Protects against a locked or slow query holding a page request open indefinitely."
COM_FGREPORTS_CONFIG_DBAPPLICATIONINTENT_LABEL="Read-Only Application Intent"
COM_FGREPORTS_CONFIG_DBAPPLICATIONINTENT_DESC="Adds ApplicationIntent=ReadOnly to the connection string. On a SQL Server Availability Group listener this can route the connection to a readable secondary replica; on a standalone server (no AG) it has no effect. Off by default since this changes routing behaviour and we can't verify your server's topology from here - enable only if you know your setup supports it."
COM_FGREPORTS_CONFIG_PREVIEW_LIMIT_LABEL="Preview Row Limit"
COM_FGREPORTS_CONFIG_PREVIEW_LIMIT_DESC="Maximum number of rows fetched when using \"Run Preview\" in the report editor."
COM_FGREPORTS_CONFIG_MAX_ROWS_LABEL="Max Rows Per Report"
COM_FGREPORTS_CONFIG_MAX_ROWS_DESC="Safety cap on how many rows a report actually fetches and holds in PHP memory (front-end display and caching), regardless of how many rows the query would otherwise return. SQL Server still runs the full query either way - this only bounds what PHP buffers. If a report hits this cap, the front end shows a warning instead of silently showing an incomplete result. Add a TOP/WHERE to the report's SQL if you need more than this."
COM_FGREPORTS_CONFIG_DEFAULT_CACHE_TTL_LABEL="Default Cache (minutes)"
COM_FGREPORTS_CONFIG_DEFAULT_CACHE_TTL_DESC="Suggested default for new reports (each report can override this)."
COM_FGREPORTS_CONFIG_FRONTEND_PAGE_LIMIT_LABEL="Rows Per Page (default)"
COM_FGREPORTS_CONFIG_FRONTEND_PAGE_LIMIT_DESC="Default number of rows shown per page on the front end. Each report can override this individually."
COM_FGREPORTS_CONFIG_NOTE_READONLY_LABEL="Use a read-only database login"
COM_FGREPORTS_CONFIG_NOTE_READONLY_DESC="Report scripts run exactly as written, with no query builder in between. The only real safeguard against a destructive script is configuring this connection with an MS SQL login that only has SELECT permission on the relevant tables/views."

COM_FGREPORTS_TEST_CONNECTION_SUCCESS="Connection successful."
COM_FGREPORTS_TEST_CONNECTION_FAILED="Connection failed: %s"

COM_FGREPORTS_ERROR_TITLE_REQUIRED="Title is required."
COM_FGREPORTS_ERROR_SQL_REQUIRED="SQL script is required."
COM_FGREPORTS_WARNING_NOTABLE_KEYWORD="Heads up: this script contains the keyword \"%s\", which a typical read-only reporting SELECT wouldn't need. This is not a security check and does not block saving or running the report - make sure the MS SQL login configured in Options actually only has SELECT permission, since that (not this notice) is what actually prevents unwanted writes."
COM_FGREPORTS_ERROR_CONNECTION_NOT_CONFIGURED="The MS SQL connection has not been fully configured yet. Go to Options and fill in the server, database and username."
COM_FGREPORTS_ERROR_PDO_SQLSRV_MISSING="The PHP pdo_sqlsrv extension is not installed/enabled on this server. Install the Microsoft Drivers for PHP for SQL Server."
COM_FGREPORTS_ERROR_REPORT_NOT_FOUND="Report not found."
COM_FGREPORTS_ERROR_REPORT_EXECUTION_GENERIC="This report could not be displayed right now. Please contact the site administrator."

COM_FGREPORTS_ACCESS_OPTIONS_DESC="Manage the component options, including the MS SQL connection settings."
COM_FGREPORTS_ACCESS_CREATE_DESC="Create new reports."
COM_FGREPORTS_ACCESS_EDIT_DESC="Edit existing reports, including their SQL script."
COM_FGREPORTS_ACCESS_EDITSTATE_DESC="Publish/unpublish reports."
COM_FGREPORTS_ACCESS_DELETE_DESC="Delete reports."
COM_FGREPORTS_ACCESS_EXECUTE="Use Interactive SQL Preview"
COM_FGREPORTS_ACCESS_EXECUTE_DESC="Allows using \"Run Preview\" in the report editor, which runs arbitrary SQL against the configured MS SQL connection immediately, without saving the report first. Separate from core.create/core.edit, since \"can create reports\" and \"can run ad-hoc SQL against the reporting database interactively\" are different levels of trust."
