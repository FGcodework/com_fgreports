COM_FGREPORTS_TOOLBAR_TEST_CONNECTION="Test pripojenia"

COM_FGREPORTS_FIELD_TITLE_LABEL="Názov"
COM_FGREPORTS_FIELD_ALIAS_LABEL="Alias"
COM_FGREPORTS_FIELD_ALIAS_DESC="Používa sa vo frontendovej URL. Ak necháš prázdne, vygeneruje sa z názvu."
COM_FGREPORTS_FIELD_ALIAS_HINT="automaticky generovaný"
COM_FGREPORTS_FIELD_DESCRIPTION_LABEL="Popis"
COM_FGREPORTS_FIELD_SQL_LABEL="SQL skript"
COM_FGREPORTS_FIELD_SQL_DESC="Jeden SELECT skript = jeden report. Pre pripojenie nastavené v Nastaveniach použi read-only MS SQL login - toto pole samo osebe žiadne oprávnenia neriadi."
COM_FGREPORTS_FIELD_CACHE_TTL_LABEL="Cache (minúty)"
COM_FGREPORTS_FIELD_CACHE_TTL_DESC="0 = dopyt sa spustí pri každom zobrazení stránky. Iná hodnota = výsledok sa uloží do cache na daný počet minút. Pozor: pri zapnutej cache sa výsledok reportu fyzicky uloží ako druhá kópia v Joomla cache (súbor/databáza/Redis, podľa tvojho nastavenia cache v Joomle) - nejde len o opätovné načítanie z MS SQL. Pre reporty s citlivými dátami, ktoré nechceš mať duplikované mimo zdrojovej databázy, nechaj hodnotu 0."
COM_FGREPORTS_FIELD_PAGE_LIMIT_LABEL="Riadkov na stránku"
COM_FGREPORTS_FIELD_PAGE_LIMIT_DESC="0 = použije sa predvolená hodnota z Nastavení. Iná hodnota ju prepíše len pre tento report."
COM_FGREPORTS_FIELD_STACK_MOBILE_LABEL="Stackovať na mobile"
COM_FGREPORTS_FIELD_STACK_MOBILE_DESC="Pridá tabuľke tohto reportu CSS triedu \"responsiv\", takže ju plg_system_fgresponsivetables (ak je nainštalovaný a publikovaný) na úzkych obrazovkách rozloží do kariet. Bez tohto pluginu nemá voľba žiadny efekt."
COM_FGREPORTS_FIELD_TABLE_CSS_CLASS_LABEL="Extra CSS trieda(y)"
COM_FGREPORTS_FIELD_TABLE_CSS_CLASS_DESC="Voliteľné, medzerou oddelené CSS triedy pridané na element tabuľky tohto reportu - napr. rwd-sticky-col pre prilepený prvý stĺpec z plg_system_fgresponsivetables. Ponechajú sa len písmená, čísla, pomlčky a podčiarkovníky."

COM_FGREPORTS_FIELD_SELECT_REPORT_LABEL="Vyber report"
COM_FGREPORTS_FIELD_SELECT_REPORT_DESC="Vyber, ktorý report má táto položka menu zobrazovať."
COM_FGREPORTS_VIEW_REPORTS_TITLE="Zoznam reportov"
COM_FGREPORTS_VIEW_REPORTS_DESC="Zobrazí zoznam všetkých publikovaných SQL reportov, ktoré má prihlásený používateľ právo vidieť. Každý report v zozname je odkaz na jeho detail."
COM_FGREPORTS_VIEW_REPORT_TITLE="Jeden report"
COM_FGREPORTS_VIEW_REPORT_DESC="Zobrazí jeden konkrétny SQL report vybraný nižšie."

COM_FGREPORTS_BUTTON_PREVIEW="Spustiť náhľad"
COM_FGREPORTS_PREVIEW_RUNNING="Spúšťam..."
COM_FGREPORTS_PREVIEW_NO_ROWS="Dopyt nevrátil žiadne riadky."
COM_FGREPORTS_PREVIEW_ROW_COUNT="riadok/ov"
COM_FGREPORTS_PREVIEW_TRUNCATED="orezané - existuje viac riadkov, než je zobrazených"

COM_FGREPORTS_CONFIG_FIELDSET_CONNECTION="Pripojenie k MS SQL Serveru"
COM_FGREPORTS_CONFIG_FIELDSET_EXECUTION="Spúšťanie"
COM_FGREPORTS_CONFIG_DBHOST_LABEL="Server / Host"
COM_FGREPORTS_CONFIG_DBHOST_DESC="Hostname alebo IP adresa MS SQL Servera v lokálnej sieti. Pre pomenovanú inštanciu zadaj host\\instancia (napr. SQL01\\SQLEXPRESS) - pole Port sa potom ignoruje, keďže pomenované inštancie si port zisťujú cez službu SQL Browser. Priamo sem môžeš zadať aj explicitné host,port."
COM_FGREPORTS_CONFIG_DBPORT_LABEL="Port"
COM_FGREPORTS_CONFIG_DBPORT_DESC="Predvolený port MS SQL Servera je 1433."
COM_FGREPORTS_CONFIG_DBNAME_LABEL="Databáza"
COM_FGREPORTS_CONFIG_DBNAME_DESC="Názov databázy, nad ktorou sa budú spúšťať reporty."
COM_FGREPORTS_CONFIG_DBUSER_LABEL="Používateľské meno"
COM_FGREPORTS_CONFIG_DBUSER_DESC="Použi login, ktorý má na SQL Serveri len oprávnenie SELECT - to je skutočná bezpečnostná poistka pre skripty reportov."
COM_FGREPORTS_CONFIG_DBPASS_LABEL="Heslo"
COM_FGREPORTS_CONFIG_DBPASS_DESC="Ak necháš prázdne, zostane uložené aktuálne heslo."
COM_FGREPORTS_CONFIG_DBENCRYPT_LABEL="Šifrovať pripojenie"
COM_FGREPORTS_CONFIG_DBENCRYPT_DESC="Odporúčané. Vyžaduje platný certifikát na SQL Serveri, pokiaľ nižšie nepovolíš aj dôveru voči certifikátu servera."
COM_FGREPORTS_CONFIG_DBTRUSTCERT_LABEL="Dôverovať certifikátu servera"
COM_FGREPORTS_CONFIG_DBTRUSTCERT_DESC="Zapni len v dôveryhodnej lokálnej sieti so self-signed certifikátom na SQL Serveri."
COM_FGREPORTS_CONFIG_DBTIMEOUT_LABEL="Timeout pripojenia (sekundy)"
COM_FGREPORTS_CONFIG_DBTIMEOUT_DESC="Ako dlho čakať pri nadväzovaní pripojenia."
COM_FGREPORTS_CONFIG_DBQUERYTIMEOUT_LABEL="Timeout dopytu (sekundy)"
COM_FGREPORTS_CONFIG_DBQUERYTIMEOUT_DESC="Nezávisle od timeoutu pripojenia vyššie - ako dlho môže bežať SQL skript reportu po úspešnom pripojení, kým sa preruší. Chráni pred tým, aby zaseknutý alebo pomalý dopyt držal request otvorený donekonečna."
COM_FGREPORTS_CONFIG_DBAPPLICATIONINTENT_LABEL="Read-Only Application Intent"
COM_FGREPORTS_CONFIG_DBAPPLICATIONINTENT_DESC="Pridá do connection stringu ApplicationIntent=ReadOnly. Na SQL Server Availability Group listeneri to môže presmerovať pripojenie na readable secondary repliku; na samostatnom serveri (bez AG) to nemá žiadny efekt. Predvolene vypnuté, keďže to mení smerovanie a odtiaľto nevieme overiť topológiu tvojho servera - zapni len ak vieš, že to tvoje nastavenie podporuje."
COM_FGREPORTS_CONFIG_PREVIEW_LIMIT_LABEL="Limit riadkov pre náhľad"
COM_FGREPORTS_CONFIG_PREVIEW_LIMIT_DESC="Maximálny počet riadkov načítaných pri použití tlačidla \"Spustiť náhľad\" v editore reportu."
COM_FGREPORTS_CONFIG_MAX_ROWS_LABEL="Max. počet riadkov na report"
COM_FGREPORTS_CONFIG_MAX_ROWS_DESC="Bezpečnostný strop na to, koľko riadkov report reálne načíta a podrží v PHP pamäti (zobrazenie na frontende aj cache), bez ohľadu na to, koľko riadkov by dopyt inak vrátil. SQL Server aj tak vždy dobehne celý dopyt - toto obmedzuje len to, čo si PHP nabuferuje. Ak report tento strop dosiahne, frontend namiesto ticho neúplného výsledku zobrazí upozornenie. Ak potrebuješ viac, pridaj do SQL skriptu TOP/WHERE."
COM_FGREPORTS_CONFIG_DEFAULT_CACHE_TTL_LABEL="Predvolená cache (minúty)"
COM_FGREPORTS_CONFIG_DEFAULT_CACHE_TTL_DESC="Navrhovaná predvolená hodnota pre nové reporty (každý report si ju môže zmeniť)."
COM_FGREPORTS_CONFIG_FRONTEND_PAGE_LIMIT_LABEL="Riadkov na stránku (predvolené)"
COM_FGREPORTS_CONFIG_FRONTEND_PAGE_LIMIT_DESC="Predvolený počet riadkov zobrazených na jednej stránke na frontende. Každý report si to môže individuálne prepísať."
COM_FGREPORTS_CONFIG_NOTE_READONLY_LABEL="Používaj read-only databázový login"
COM_FGREPORTS_CONFIG_NOTE_READONLY_DESC="Skripty reportov sa spúšťajú presne tak, ako sú napísané, bez akéhokoľvek query buildera medzi tým. Jediná skutočná ochrana pred deštruktívnym skriptom je nastaviť toto pripojenie s MS SQL loginom, ktorý má na príslušných tabuľkách/pohľadoch len oprávnenie SELECT."

COM_FGREPORTS_TEST_CONNECTION_SUCCESS="Pripojenie úspešné."
COM_FGREPORTS_TEST_CONNECTION_FAILED="Pripojenie zlyhalo: %s"

COM_FGREPORTS_ERROR_TITLE_REQUIRED="Názov je povinný."
COM_FGREPORTS_ERROR_SQL_REQUIRED="SQL skript je povinný."
COM_FGREPORTS_WARNING_NOTABLE_KEYWORD="Upozornenie: tento skript obsahuje kľúčové slovo \"%s\", ktoré bežný read-only reportovací SELECT zvyčajne nepotrebuje. Toto nie je bezpečnostná kontrola a uloženie ani spustenie reportu neblokuje - over si, že MS SQL login nastavený v Options má naozaj len oprávnenie SELECT, lebo to (nie toto upozornenie) je to, čo skutočne bráni nechcenému zápisu."
COM_FGREPORTS_ERROR_CONNECTION_NOT_CONFIGURED="Pripojenie k MS SQL zatiaľ nie je úplne nastavené. Choď do Nastavení a vyplň server, databázu a používateľské meno."
COM_FGREPORTS_ERROR_PDO_SQLSRV_MISSING="Na tomto serveri nie je nainštalované/povolené PHP rozšírenie pdo_sqlsrv. Nainštaluj Microsoft Drivers for PHP for SQL Server."
COM_FGREPORTS_ERROR_REPORT_NOT_FOUND="Report sa nenašiel."
COM_FGREPORTS_ERROR_REPORT_EXECUTION_GENERIC="Tento report sa momentálne nedá zobraziť. Kontaktuj administrátora webu."

COM_FGREPORTS_ACCESS_OPTIONS_DESC="Správa nastavení komponentu vrátane pripojenia k MS SQL."
COM_FGREPORTS_ACCESS_CREATE_DESC="Vytváranie nových reportov."
COM_FGREPORTS_ACCESS_EDIT_DESC="Úprava existujúcich reportov vrátane ich SQL skriptu."
COM_FGREPORTS_ACCESS_EDITSTATE_DESC="Publikovanie/odpublikovanie reportov."
COM_FGREPORTS_ACCESS_DELETE_DESC="Mazanie reportov."
COM_FGREPORTS_ACCESS_EXECUTE="Použitie interaktívneho SQL náhľadu"
COM_FGREPORTS_ACCESS_EXECUTE_DESC="Umožňuje použiť \"Spustiť náhľad\" v editore reportu, ktorý okamžite spustí ľubovoľný SQL na nakonfigurovanom MS SQL pripojení, bez toho, aby sa report najprv uložil. Nezávislé od core.create/core.edit, keďže \"môže vytvárať reporty\" a \"môže interaktívne spúšťať ľubovoľný SQL nad reportovacou databázou\" sú rôzne úrovne dôvery."
COM_FGREPORTS_UNSUPPORTED_VALUE="[nepodporovaná hodnota]"
